<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox &amp; Grid Playground</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  h1 {
    text-align: center;
  }
  .stage {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  #container {
    background: #eef2f7;
    border: 2px dashed #7b93b5;
    min-height: 260px;
    padding: 10px;
  }
  .item {
    background: #4c9aff;
    color: #fff;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    height: 70px;
  }
  .item:nth-child(1) { background: #4c9aff; }
  .item:nth-child(2) { background: #82c99a; }
  .item:nth-child(3) { background: #ffb84c; }
  .item:nth-child(4) { background: #d17bd1; }
  .item:nth-child(5) { background: #ff7b7b; }

  .panel {
    max-width: 900px;
    margin: 20px auto 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .control-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control-row label {
    font-weight: bold;
    font-size: 13px;
  }
  select {
    padding: 6px 8px;
  }
</style>
</head>
<body>

<h1>Flexbox &amp; Grid Playground</h1>

<div class="stage">
  <div id="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
  </div>
</div>

<div class="panel">
  <div class="control-row">
    <label for="displaySelect">display</label>
    <select id="displaySelect">
      <option value="block">block</option>
      <option value="flex">flex</option>
      <option value="grid">grid</option>
    </select>
  </div>

  <div class="control-row">
    <label for="flexDirectionSelect">flex-direction</label>
    <select id="flexDirectionSelect">
      <option value="row">row</option>
      <option value="column">column</option>
    </select>
  </div>

  <div class="control-row">
    <label for="justifyContentSelect">justify-content</label>
    <select id="justifyContentSelect">
      <option value="flex-start">flex-start</option>
      <option value="center">center</option>
      <option value="flex-end">flex-end</option>
      <option value="space-between">space-between</option>
      <option value="space-around">space-around</option>
      <option value="space-evenly">space-evenly</option>
    </select>
  </div>

  <div class="control-row">
    <label for="alignItemsSelect">align-items</label>
    <select id="alignItemsSelect">
      <option value="stretch">stretch</option>
      <option value="flex-start">flex-start</option>
      <option value="center">center</option>
      <option value="flex-end">flex-end</option>
    </select>
  </div>

  <div class="control-row">
    <label for="gridColumnsSelect">grid-template-columns</label>
    <select id="gridColumnsSelect">
      <option value="1fr 1fr">1fr 1fr</option>
      <option value="1fr 1fr 1fr">1fr 1fr 1fr</option>
      <option value="1fr 1fr 1fr 1fr">1fr 1fr 1fr 1fr</option>
      <option value="2fr 1fr 1fr">2fr 1fr 1fr</option>
    </select>
  </div>
</div>

<script>
  const container = document.getElementById('container');

  const displaySelect = document.getElementById('displaySelect');
  const flexDirectionSelect = document.getElementById('flexDirectionSelect');
  const justifyContentSelect = document.getElementById('justifyContentSelect');
  const alignItemsSelect = document.getElementById('alignItemsSelect');
  const gridColumnsSelect = document.getElementById('gridColumnsSelect');

  function update() {
    const displayValue = displaySelect.value;
    container.style.display = displayValue;

    if (displayValue === 'flex') {
      container.style.flexDirection = flexDirectionSelect.value;
      container.style.justifyContent = justifyContentSelect.value;
      container.style.alignItems = alignItemsSelect.value;
      container.style.gridTemplateColumns = '';
    } else if (displayValue === 'grid') {
      container.style.gridTemplateColumns = gridColumnsSelect.value;
      container.style.justifyContent = justifyContentSelect.value;
      container.style.alignItems = alignItemsSelect.value;
      container.style.flexDirection = '';
    } else {
      container.style.flexDirection = '';
      container.style.justifyContent = '';
      container.style.alignItems = '';
      container.style.gridTemplateColumns = '';
    }
  }

  [displaySelect, flexDirectionSelect, justifyContentSelect, alignItemsSelect, gridColumnsSelect]
    .forEach(el => el.addEventListener('change', update));

  update();
</script>

</body>
</html>
